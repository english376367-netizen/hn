<script>
const sections=[{"title": "Bài 1 – Pronunciation", "desc": "Choose the word with a different sound in the underlined part.", "qs": [["mc", "1. Choose the word with a different sound.", ["A. ch<u>oo</u>se", "B. l<u>oo</u>k", "C. sp<u>oo</u>n", "D. f<u>oo</u>d"], 1, "B. look /lʊk/ có âm /ʊ/, còn choose, spoon, food có âm /uː/.", "Chọn từ có cách phát âm khác ở phần được gạch chân."], ["mc", "2. Choose the word with a different sound.", ["A. tr<u>u</u>th", "B. J<u>u</u>ne", "C. c<u>u</u>shion", "D. concl<u>u</u>sion"], 2, "C. cushion có âm /ʊ/, còn các từ còn lại có âm /uː/.", "Chọn từ có cách phát âm khác ở phần được gạch chân."], ["mc", "3. Choose the word with a different sound.", ["A. ag<u>a</u>in", "B. comp<u>a</u>ny", "C. wom<u>a</u>n", "D. vill<u>a</u>ger"], 3, "D. villager có âm /ɪ/ ở phần được xét; các từ còn lại có âm /ə/ theo đáp án hướng dẫn.", "Chọn từ có cách phát âm khác ở phần được gạch chân."], ["mc", "4. Choose the word with a different sound.", ["A. mixt<u>u</u>re", "B. leis<u>u</u>re", "C. l<u>u</u>re", "D. lect<u>u</u>re"], 2, "C. lure có cách phát âm khác ở phần gạch chân so với mixture, leisure và lecture.", "Chọn từ có cách phát âm khác ở phần được gạch chân."], ["mc", "5. Choose the word with a different sound.", ["A. ch<u>oi</u>ce", "B. j<u>oi</u>n", "C. g<u>oi</u>ng", "D. n<u>oi</u>se"], 2, "C. going có âm /əʊ/; choice, join và noise có âm /ɔɪ/.", "Chọn từ có cách phát âm khác ở phần được gạch chân."]]}, {"title": "Bài 2 – Vocabulary and Grammar", "desc": "Choose the correct answer A, B, C or D.", "qs": [["mc", "1. In his free time, my younger brother is ______ on taking photos and doing puzzles.", ["A. fond", "B. keen", "C. interested", "D. crazy"], 1, "Be keen on + danh từ/V-ing = rất thích.", "Trong thời gian rảnh rỗi, em trai tôi rất thích chụp ảnh và xếp hình."], ["mc", "2. What are you interested ______ doing at weekends?", ["A. into", "B. on", "C. about", "D. in"], 3, "Cấu trúc: be interested in + danh từ/V-ing = hứng thú với việc gì.", "Bạn thích làm gì vào cuối tuần?"], ["mc", "3. How often do you ______ notifications on Facebook? – Once a day.", ["A. upload", "B. browse", "C. connect", "D. check"], 3, "Check notifications = kiểm tra thông báo.", "Bạn có thường xuyên kiểm tra thông báo trên Facebook không? – Mỗi ngày một lần."], ["mc", "4. Be quiet, please! I'm trying to ______ on my homework.", ["A. concentrate", "B. log", "C. advise", "D. bully"], 0, "Concentrate on something = tập trung vào việc gì.", "Làm ơn hãy im lặng! Tôi đang cố tập trung làm bài tập về nhà."], ["mc", "5. It's ______ time, so the villagers are busy cutting and gathering their crops.", ["A. festival", "B. growing", "C. harvest", "D. planting"], 2, "Harvest time = mùa thu hoạch.", "Đã đến mùa thu hoạch nên dân làng đang bận rộn cắt và thu hoạch mùa màng."]]}, {"title": "Bài 3 – Word forms", "desc": "Complete each sentence with the correct form of the word in brackets.", "qs": [["text", "1. The farmers are ______ the rice from the back of the truck. (LOAD)", "unloading", "unloading", "unload → unloading; ngữ cảnh là dỡ lúa khỏi phía sau xe tải.", "Những người nông dân đang dỡ lúa từ phía sau xe tải."], ["text", "2. They live in a beautiful cottage ______ by trees and flowers. (SURROUND)", "surrounded", "surrounded", "Dùng quá khứ phân từ surrounded để diễn tả ngôi nhà được bao quanh bởi cây và hoa.", "Họ sống trong một ngôi nhà nhỏ xinh đẹp được bao quanh bởi cây cối và hoa."], ["text", "3. When you feel you have to do something so that your friends accept you, you're experiencing peer ______. (PRESS)", "pressure", "pressure", "Peer pressure = áp lực từ bạn bè; cần danh từ pressure.", "Khi bạn cảm thấy mình phải làm điều gì đó để bạn bè chấp nhận mình, bạn đang trải qua áp lực từ bạn bè."], ["text", "4. The Internet ______ at our home is not strong, so I can't study online. (CONNECT)", "connection", "connection", "Cần danh từ connection sau cụm danh từ “The Internet”.", "Kết nối Internet ở nhà chúng tôi không mạnh, vì vậy tôi không thể học trực tuyến."], ["text", "5. I ______ cooking because I usually burn the food. (LIKE)", "dislike", "dislike", "Dislike = không thích; hợp với lý do thường làm cháy thức ăn.", "Tôi không thích nấu ăn vì tôi thường làm cháy thức ăn."]]}, {"title": "Bài 4 – Find and correct the mistake", "desc": "Choose the incorrect part and correct it.", "qs": [["mc", "1. Mi loves playing sport, so his brother hates it. Which word should change?", ["A. loves", "B. playing", "C. so", "D. hates"], 2, "Thay so bằng but để diễn tả sự tương phản giữa việc Mi thích thể thao và anh trai ghét nó.", "Mi thích chơi thể thao, nhưng anh trai của cậu ấy ghét nó."], ["mc", "2. Farmers should plough their fields carefully; however, they will not have a bumper crop. Which word should change?", ["A. should", "B. carefully", "C. however", "D. bumper"], 2, "Thay however bằng otherwise (nếu không thì) để diễn tả kết quả tiêu cực nếu không cày cẩn thận.", "Nông dân nên cày ruộng cẩn thận; nếu không, họ sẽ không có một vụ mùa bội thu."], ["mc", "3. If you don’t do your homework more careful, you won’t get good marks. Which word should change?", ["A. don’t", "B. homework", "C. careful", "D. marks"], 2, "Cần trạng từ carefully bổ nghĩa cho động từ do, không dùng tính từ careful.", "Nếu bạn không làm bài tập về nhà cẩn thận hơn, bạn sẽ không đạt điểm cao."], ["mc", "4. In his free time, my grandpa enjoys to catch fish and feeding pigs. Which part should change?", ["A. In his free time", "B. enjoys", "C. to catch", "D. feeding"], 2, "Enjoy + V-ing. Vì vậy dùng catching để song song với feeding.", "Khi rảnh rỗi, ông tôi thích bắt cá và cho lợn ăn."], ["mc", "5. She hates use Facebook Messenger to discuss schoolwork. Which part should change?", ["A. hates", "B. use", "C. discuss", "D. schoolwork"], 1, "Sau hate có thể dùng to V hoặc V-ing: hates to use / hates using.", "Cô ấy ghét sử dụng Facebook Messenger để thảo luận về bài tập ở trường."]]}, {"title": "Bài 5 – Choose the correct form", "desc": "Choose the correct word or phrase.", "qs": [["mc", "1. My brother studies (harder / hardly) than my sister.", ["A. harder", "B. hardly"], 0, "So sánh hơn của trạng từ hard là harder; hardly nghĩa là hầu như không.", "Anh trai tôi học hành chăm chỉ hơn chị gái tôi."], ["mc", "2. Ann uploads pictures to social networks more (frequently / frequent) than her friends.", ["A. frequently", "B. frequent"], 0, "Cần trạng từ frequently để bổ nghĩa cho động từ uploads; more frequently là thường xuyên hơn.", "Ann tải ảnh lên mạng xã hội thường xuyên hơn bạn bè của cô ấy."], ["mc", "3. Phong spends a lot of time doing puzzles; (therefore / otherwise), he can solve puzzles more quickly than his other classmates can.", ["A. therefore", "B. otherwise"], 0, "Therefore = do đó, vì vậy; diễn tả kết quả hợp lý từ vế trước.", "Phong dành nhiều thời gian giải câu đố; do đó, cậu ấy có thể giải câu đố nhanh hơn các bạn cùng lớp khác."], ["mc", "4. What does your sister dislike (to do / doing) in her free time?", ["A. to do", "B. doing"], 1, "Dislike thường đi với V-ing: dislike doing something.", "Em gái bạn không thích làm gì trong thời gian rảnh?"], ["mc", "5. It's late now, and I can't stay any (long / longer).", ["A. long", "B. longer"], 1, "Any longer dùng trong câu phủ định với nghĩa “không … thêm nữa”.", "Bây giờ muộn rồi và tôi không thể ở lại lâu hơn nữa."]]}, {"title": "Bài 6 – Complete the email", "desc": "Choose the correct answer to complete the email.", "qs": [["mc", "Blank (1): I live in Ha Noi, ______ my home town is Ninh Binh.", ["A. but", "B. so", "C. for", "D. or"], 0, "But nối hai ý tương phản: nơi đang sống là Hà Nội, quê nhà là Ninh Bình.", "Tôi sống ở Hà Nội, nhưng quê nhà của tôi là Ninh Bình."], ["mc", "Blank (2): Every morning, my grandma and I got up early and ______ the pigs and chickens.", ["A. feed", "B. is feeding", "C. fed", "D. will fed"], 2, "Câu kể về kỳ nghỉ trong quá khứ; got up và fed đều ở quá khứ đơn.", "Mỗi sáng, bà và tôi dậy sớm rồi cho lợn và gà ăn."], ["mc", "Blank (3): After that, I ______ fishing with my grandpa.", ["A. could", "B. went", "C. did", "D. played"], 1, "Cụm từ cố định: go fishing; ở quá khứ là went fishing.", "Sau đó, tôi đi câu cá với ông."], ["mc", "Blank (4): They taught me to ______ the buffaloes.", ["A. run", "B. get", "C. go", "D. herd"], 3, "Herd the buffaloes = chăn trâu.", "Họ dạy tôi chăn trâu."], ["mc", "Blank (5): I'm sending you a photo I took ______ my grandparents' house.", ["A. for", "B. of", "C. on", "D. next"], 1, "A photo of something = ảnh chụp thứ gì/ai.", "Tôi gửi cho bạn một bức ảnh chụp ngôi nhà của ông bà tôi."]]}, {"title": "Bài 7a – Reading: Matching", "desc": "Match each word or phrase with its meaning. Select the correct meaning.", "qs": [["mc", "1. potentially means ______.", ["A. very different", "B. possibly", "C. working as a team", "D. time management"], 1, "Potentially = possibly, nghĩa là có khả năng/có thể.", "Từ potentially có nghĩa là có khả năng/có thể."], ["mc", "2. diverse means ______.", ["A. a chance", "B. possibly", "C. very different from each other", "D. confident"], 2, "Diverse = đa dạng, rất khác nhau.", "Từ diverse có nghĩa là đa dạng, khác nhau."], ["mc", "3. teamwork means ______.", ["A. working well together as a team", "B. using time effectively", "C. a possibility", "D. close friends"], 0, "Teamwork là tinh thần đồng đội, sự phối hợp làm việc trong nhóm.", "Teamwork có nghĩa là làm việc tốt cùng nhau như một đội."], ["mc", "4. time management means ______.", ["A. communication", "B. being confident", "C. taking part", "D. the ability to use time effectively"], 3, "Time management = khả năng sử dụng thời gian hiệu quả.", "Time management có nghĩa là khả năng sử dụng thời gian hiệu quả."], ["mc", "5. chance means ______.", ["A. a possibility something will happen", "B. a group of friends", "C. a skill", "D. a school subject"], 0, "Chance = cơ hội/khả năng một việc xảy ra.", "Chance có nghĩa là cơ hội hoặc khả năng điều gì đó sẽ xảy ra."]]}, {"title": "Bài 7b – Reading: Fill in the blanks", "desc": "Fill in each blank with no more than TWO words.", "qs": [["text", "6. There are students with something ______ in a club.", "in common", "in common", "Cụm từ trong bài đọc: members with something in common = các thành viên có điểm chung.", "Có những học sinh có điểm chung trong một câu lạc bộ."], ["text", "7. Club meetings help members ______ one another.", "understand", "understand", "Bài đọc nêu meetings help members better understand one another.", "Các buổi họp câu lạc bộ giúp các thành viên hiểu nhau."], ["text", "8. Joining a club develops students' ______ like communication, teamwork, and time management.", "skills", "skills", "Communication, teamwork và time management đều là skills (kỹ năng).", "Tham gia câu lạc bộ giúp phát triển các kỹ năng của học sinh như giao tiếp, làm việc nhóm và quản lý thời gian."], ["text", "9. Being a club member makes students more ______.", "confident", "confident", "Bài đọc nêu thành viên câu lạc bộ có thể trở nên tự tin hơn.", "Trở thành thành viên câu lạc bộ giúp học sinh tự tin hơn."], ["text", "10. They will also feel ______ about themselves.", "much better", "much better", "Cụm trong bài đọc: feel much better about yourself = cảm thấy tốt hơn nhiều về bản thân.", "Họ cũng sẽ cảm thấy tốt hơn nhiều về bản thân."]]}, {"title": "Bài 8 – Writing", "desc": "Write a complete sentence using the suggested words. Answers are checked against the model answer.", "qs": [["text", "1. Nam / not good / dancing / however / he / member / dancing club.", "Nam is not good at dancing; however, he is a member of the dancing club.", "Nam is not good at dancing; however, he is a member of the dancing club.", "Be good at + V-ing; however nối hai ý tương phản.", "Nam nhảy không giỏi; tuy nhiên, cậu ấy là thành viên của câu lạc bộ khiêu vũ."], ["text", "2. Lan / fond / message / friends / because / it / more convenient / call.", "Lan is fond of messaging her friends because it is more convenient than calling.", "Lan is fond of messaging her friends because it is more convenient than calling.", "Be fond of + V-ing; so sánh hơn: more convenient than.", "Lan thích nhắn tin cho bạn bè vì việc đó thuận tiện hơn gọi điện."], ["text", "3. Feed / pigs / and / milk / cows / be / her / daily / activity.", "Feeding pigs and milking cows are her daily activities.", "Feeding pigs and milking cows are her daily activities.", "Hai cụm V-ing làm chủ ngữ ghép nên dùng động từ số nhiều are; activities ở số nhiều.", "Cho lợn ăn và vắt sữa bò là những công việc hằng ngày của cô ấy."], ["text", "4. Today / farmer / village / usually / use / combine harvester / harvest / crops.", "Today farmers in my village usually use combine harvesters to harvest their crops.", "Today farmers in my village usually use combine harvesters to harvest their crops.", "Today thường dùng hiện tại đơn; use something to do something = dùng cái gì để làm việc gì.", "Ngày nay, nông dân ở làng tôi thường dùng máy gặt đập liên hợp để thu hoạch mùa màng."], ["text", "5. Teenagers' / stress / may / come / schoolwork / family / friend.", "Teenagers' stress may come from schoolwork, family, or friends.", "Teenagers' stress may come from schoolwork, family, or friends.", "Come from = bắt nguồn từ; liệt kê các nguyên nhân bằng or.", "Sự căng thẳng của thanh thiếu niên có thể bắt nguồn từ việc học, gia đình hoặc bạn bè."]]}];let s=0,q=0;let state=sections.map(x=>x.qs.map(()=>({locked:false,ok:false,val:null})));

function clean(x){return String(x).replace(/<[^>]*>/g,'').trim().toLowerCase().replace(/[.,;:!?']/g,'').replace(/\s+/g,' ')}
const readingEnglish = `A lot of teenagers take part in clubs in their schools. So what are the benefits of school clubs?

First, when you join a school club you make new friends. You will meet other students who could potentially become your new close friends. The reason is that clubs have members with something in common. At club meetings you will spend some time with other members. This will help you better understand one another and even become friends.

In addition, being a club member helps you learn new skills. By participating in different clubs and working with diverse people, you can develop such skills as communication, teamwork, and time management.

Another benefit of joining a club is that you can improve yourself. You not only learn more about your area of interest but you can also become more confident. You will have a chance to work with new people, organise club activities, and take part in different events. This will make you feel much better about yourself.`;
const readingVietnamese = `Rất nhiều thanh thiếu niên tham gia các câu lạc bộ ở trường. Vậy các câu lạc bộ ở trường mang lại những lợi ích gì?

Trước hết, khi tham gia một câu lạc bộ ở trường, bạn sẽ kết bạn mới. Bạn sẽ gặp những học sinh khác, những người có thể trở thành bạn thân mới của bạn. Lý do là các câu lạc bộ có những thành viên có điểm chung. Trong các buổi sinh hoạt câu lạc bộ, bạn sẽ dành thời gian với những thành viên khác. Điều này giúp các bạn hiểu nhau hơn và thậm chí trở thành bạn bè.

Ngoài ra, trở thành thành viên câu lạc bộ giúp bạn học những kỹ năng mới. Bằng cách tham gia các câu lạc bộ khác nhau và làm việc với nhiều người đa dạng, bạn có thể phát triển những kỹ năng như giao tiếp, làm việc nhóm và quản lý thời gian.

Một lợi ích khác của việc tham gia câu lạc bộ là bạn có thể hoàn thiện bản thân. Bạn không chỉ tìm hiểu thêm về lĩnh vực mình quan tâm mà còn có thể trở nên tự tin hơn. Bạn sẽ có cơ hội làm việc với những người mới, tổ chức các hoạt động câu lạc bộ và tham gia những sự kiện khác nhau. Điều này sẽ giúp bạn cảm thấy tốt hơn nhiều về bản thân.`;
function render(){let sec=sections[s],item=sec.qs[q],st=state[s][q];document.getElementById('sectionnav').innerHTML=sections.map((x,i)=>`<button class="${i===s?'':'alt'}" onclick="setS(${i})">${x.title}</button>`).join('');document.getElementById('heading').textContent=sec.title;document.getElementById('desc').textContent=sec.desc;document.getElementById('bar').style.width=((q+1)/sec.qs.length*100)+'%';
let out='';
if(sec.title.startsWith('Bài 7a')||sec.title.startsWith('Bài 7b')){
 const en=readingEnglish.split('\n\n').map(p=>'<p>'+p+'</p>').join('');
 const vi=readingVietnamese.split('\n\n').map(p=>'<p>'+p+'</p>').join('');
 out+=`<details open class="readingbox"><summary><b>Bài đọc tiếng Anh</b></summary><div class="readingtext">${en}</div><hr><summary><b>Bản dịch tiếng Việt</b></summary><div class="readingtext vietnamese">${vi}</div></details>`;
}
out+=`<div class="prompt">${item[1]}</div>`;
if(item[0]==='mc'){out+=item[2].map((o,i)=>`<label class="option"><input type="radio" name="answer" ${st.locked?'disabled':''} ${st.val===i?'checked':''} onchange="pick(${i})"><span>${o}</span></label>`).join('')}
else {out+=`<input id="typed" ${st.locked?'disabled':''} placeholder="Nhập đáp án..." value="${st.locked?String(st.val).replace(/&/g,'&amp;').replace(/"/g,'&quot;'):''}" onkeydown="if(event.key==='Enter')submitText()"><div style="margin-top:10px"><button onclick="submitText()" ${st.locked?'disabled':''}>Chấm đáp án</button></div>`}
if(st.locked){let answer=item[0]==='mc'?item[2][item[3]].replace(/<[^>]*>/g,''):item[2];out+=`<div class="feedback ${st.ok?'good':'bad'}"><b>${st.ok?'Chính xác! ✓':'Chưa đúng ✗'}</b><br>${st.ok?'Bạn đã trả lời đúng.':'Đáp án đúng: '+answer}<p><b>Giải thích:</b> ${item[4]}</p><p><b>Nghĩa tiếng Việt:</b> ${item[5]}</p></div>`}
document.getElementById('question').innerHTML=out;document.getElementById('prev').disabled=q===0;document.getElementById('next').disabled=q===sec.qs.length-1;document.getElementById('counter').textContent=`Câu ${q+1}/${sec.qs.length}`;let done=state[s].filter(x=>x.locked).length,points=state[s].filter(x=>x.locked&&x.ok).length;document.getElementById('score').textContent=`${points}/${sec.qs.length} · Đã làm ${done}/${sec.qs.length}`}
function pick(i){let st=state[s][q];if(st.locked)return;st.val=i;st.ok=i===sections[s].qs[q][3];st.locked=true;render()}
function submitText(){let st=state[s][q];if(st.locked)return;let v=document.getElementById('typed').value.trim();if(!v){alert('Vui lòng nhập đáp án.');return}let item=sections[s].qs[q];st.val=v;st.ok=clean(v)===clean(item[2]);st.locked=true;render()}
function move(d){q=Math.max(0,Math.min(sections[s].qs.length-1,q+d));render()}function setS(i){s=i;q=0;render()}function first(){q=0;render()}function resetPart(){if(confirm('Làm lại toàn bộ phần này? Điểm và trạng thái khóa của phần này sẽ được xóa.')){state[s]=sections[s].qs.map(()=>({locked:false,ok:false,val:null}));q=0;render()}}
</script></body></html>
